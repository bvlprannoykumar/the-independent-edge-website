# netlify.toml
# Clean URL configuration for The Independent Edge

[build]
  publish = "."

# Clean URL rewrites (200 = serve file at clean URL, no redirect)
[[redirects]]
  from = "/work-with-me"
  to = "/work-with-me.html"
  status = 200

[[redirects]]
  from = "/the-weekly-edge"
  to = "/the-weekly-edge.html"
  status = 200

[[redirects]]
  from = "/apply"
  to = "/apply.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/insights"
  to = "/insights.html"
  status = 200

# Insights articles (subfolder, Netlify serves /insights/<slug>.html at /insights/<slug>)
# These explicit rewrites are belt-and-suspenders to guarantee the clean URL works
[[redirects]]
  from = "/insights/revenue-oxygen"
  to = "/insights/revenue-oxygen.html"
  status = 200

[[redirects]]
  from = "/insights/the-silence-at-the-mandap"
  to = "/insights/the-silence-at-the-mandap.html"
  status = 200

[[redirects]]
  from = "/insights/family-whatsapp-committee"
  to = "/insights/family-whatsapp-committee.html"
  status = 200

# Trailing slash -> canonical
[[redirects]]
  from = "/work-with-me/"
  to = "/work-with-me"
  status = 301

[[redirects]]
  from = "/the-weekly-edge/"
  to = "/the-weekly-edge"
  status = 301

[[redirects]]
  from = "/apply/"
  to = "/apply"
  status = 301

[[redirects]]
  from = "/about/"
  to = "/about"
  status = 301

[[redirects]]
  from = "/privacy/"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/terms/"
  to = "/terms"
  status = 301

[[redirects]]
  from = "/insights/"
  to = "/insights"
  status = 301

[[redirects]]
  from = "/insights/revenue-oxygen/"
  to = "/insights/revenue-oxygen"
  status = 301

[[redirects]]
  from = "/insights/the-silence-at-the-mandap/"
  to = "/insights/the-silence-at-the-mandap"
  status = 301

[[redirects]]
  from = "/insights/family-whatsapp-committee/"
  to = "/insights/family-whatsapp-committee"
  status = 301

# .html -> clean URL
[[redirects]]
  from = "/work-with-me.html"
  to = "/work-with-me"
  status = 301

[[redirects]]
  from = "/the-weekly-edge.html"
  to = "/the-weekly-edge"
  status = 301

[[redirects]]
  from = "/apply.html"
  to = "/apply"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301

[[redirects]]
  from = "/insights.html"
  to = "/insights"
  status = 301

[[redirects]]
  from = "/insights/revenue-oxygen.html"
  to = "/insights/revenue-oxygen"
  status = 301

[[redirects]]
  from = "/insights/the-silence-at-the-mandap.html"
  to = "/insights/the-silence-at-the-mandap"
  status = 301

[[redirects]]
  from = "/insights/family-whatsapp-committee.html"
  to = "/insights/family-whatsapp-committee"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Aggressive cache for static images
[[headers]]
  for = "/prannoy-kumar-founder.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-default.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/insights/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
